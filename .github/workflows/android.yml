name: Build S61B SMB Music TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu's GitHub-hosted runner already has Android SDK 35.
      # Avoid android-actions/setup-android@v3, which tries to install an older
      # command-line tools version and can fail before any project code builds.
      - name: Verify preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" ]]; then
            echo "::error::Android SDK 35 not present in $SDK. Runner image changed; check installed SDK packages."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack source ZIP if repository contains only a ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle ]]; then
            DIR="$GITHUB_WORKSPACE"
          else
            # Prefer the fixed source archive if old and new ZIPs coexist.
            ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*JavaFix*OneUpload*Source.zip' -print | sort | tail -n 1)
            if [[ -z "$ZIP" ]]; then
              ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*SDKFix*OneUpload*Source.zip' -print | sort | tail -n 1)
            fi
            if [[ -z "$ZIP" ]]; then
              ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*Source.zip' -print | sort | tail -n 1)
            fi
            if [[ -z "$ZIP" ]]; then
              echo "::error::Neither settings.gradle nor source ZIP found in repository root"
              exit 1
            fi
            echo "Using source ZIP: $ZIP"
            mkdir -p "$RUNNER_TEMP/music_source"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/music_source"
            SETTINGS=$(find "$RUNNER_TEMP/music_source" -maxdepth 4 -name settings.gradle -print -quit)
            if [[ -z "$SETTINGS" ]]; then
              echo "::error::settings.gradle missing inside source ZIP"
              exit 1
            fi
            DIR=$(dirname "$SETTINGS")
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $DIR"

      - name: Fix Media3 seek increment API in existing source ZIP
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          import os
          from pathlib import Path
          source = Path(os.environ['PROJECT_DIR']) / 'app/src/main/java/com/localsmb/music/MainActivity.java'
          if not source.is_file():
              raise SystemExit(f'MainActivity.java not found: {source}')
          code = source.read_text(encoding='utf-8')
          old = ('            player = new ExoPlayer.Builder(this)\n'
                 '                    .setMediaSourceFactory(new DefaultMediaSourceFactory(source))\n'
                 '                    .build();')
          new = ('            player = new ExoPlayer.Builder(this)\n'
                 '                    .setMediaSourceFactory(new DefaultMediaSourceFactory(source))\n'
                 '                    .setSeekBackIncrementMs(10000)\n'
                 '                    .setSeekForwardIncrementMs(10000)\n'
                 '                    .build();')
          has_legacy = ('player.setSeekBackIncrementMs(10000);' in code or
                        'player.setSeekForwardIncrementMs(10000);' in code)
          if has_legacy:
              if code.count(old) != 1:
                  raise SystemExit('Legacy seek methods found but ExoPlayer.Builder block differs; manual fix needed')
              code = code.replace(old, new)
              code = code.replace('            player.setSeekBackIncrementMs(10000);\n', '')
              code = code.replace('            player.setSeekForwardIncrementMs(10000);\n', '')
              source.write_text(code, encoding='utf-8')
              print('Applied Media3 seek API correction (10s seek preserved)')
          else:
              print('Seek API already compatible; no change necessary')
          PYFIX

      - name: Build debug APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace -p "${{ steps.source.outputs.dir }}" :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: S61B-SMB-Music-TV-debug
          path: ${{ steps.source.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
