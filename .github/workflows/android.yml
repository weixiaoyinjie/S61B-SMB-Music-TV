name: Build S61B SMB Music TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack source ZIP if repository contains only a ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle ]]; then
            DIR="$GITHUB_WORKSPACE"
          else
            ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | sort | tail -n 1)
            if [[ -z "$ZIP" ]]; then echo 'Neither Gradle project nor source ZIP found'; exit 1; fi
            mkdir -p "$RUNNER_TEMP/music_source"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/music_source"
            SETTINGS=$(find "$RUNNER_TEMP/music_source" -maxdepth 3 -name settings.gradle | head -n 1)
            if [[ -z "$SETTINGS" ]]; then echo 'settings.gradle missing inside ZIP'; exit 1; fi
            DIR=$(dirname "$SETTINGS")
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "${{ steps.source.outputs.dir }}" :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: S61B-SMB-Music-TV-debug
          path: ${{ steps.source.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
